<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Store254</title>
  <meta name="theme-color" content="#0f7a44">
  <link rel="icon" type="image/png" href="/assets/pwa-icon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #f0fdf4 0%, #f8fafc 100%);
      color: #0f172a;
    }
    .card {
      width: 100%;
      max-width: 26rem;
      background: #ffffff;
      border: 1px solid #d1fae5;
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: 0 20px 45px -18px rgba(15, 122, 68, 0.18);
    }
    .logo {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 1.125rem;
      margin: 0 auto 1rem;
      display: block;
      box-shadow: 0 8px 20px -8px rgba(15, 122, 68, 0.35);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1.5rem;
      color: #475569;
      font-size: 0.9375rem;
      line-height: 1.55;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 9999px;
      font-size: 0.9375rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .primary {
      background: #0f7a44;
      color: #ffffff;
    }
    .secondary {
      background: #f8fafc;
      color: #0f172a;
      border-color: #e2e8f0;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/pwa-icon-192.png" alt="Store254" width="72" height="72">
    <h1>You are offline</h1>
    <p>Check your mobile data or Wi-Fi connection, then try again to browse Kenyan stores and live inventory.</p>
    <div class="actions">
      <button type="button" class="primary" onclick="window.location.reload()">Try Again</button>
      <a class="btn secondary" href="/">Back to Home</a>
    </div>
  </main>
</body>
</html>
