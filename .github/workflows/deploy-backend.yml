name: Deploy backend to Cloudflare

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy backend Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Apply pending database migrations
        run: npx wrangler d1 migrations apply store254-db --remote --config backend/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 29ebb98162982a3dbbd217a589591b10

      - name: Publish backend
        run: npm run deploy:backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 29ebb98162982a3dbbd217a589591b10
